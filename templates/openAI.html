<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder - AI</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="/" class="brand">AI Resume Builder</a>
        <nav class="nav-links">
            <a href="{{ url_for('list_resumes') }}">View Saved Resumes</a>
        </nav>
    </header>
    <main class="container">
        <div class="page-header">
            <h1>Resume Builder</h1>
            <p>Fill out the fields below to generate your professional resume.</p>
        </div>

        <div class="form-container">
            <form action="/openai" method="post" class="resume-form" enctype="multipart/form-data">
                
                <fieldset class="form-section">
                    <legend>Personal Details</legend>
                    <div class="form-row">
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" required placeholder="e.g. Jane Doe">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="headline">Headline</label>
                            <input type="text" id="headline" name="headline" required placeholder="e.g. Senior Software Engineer">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1.5rem;">
                            <div>
                                <label for="profile_image">Profile Picture (Optional)</label>
                                <input type="file" id="profile_image" name="profile_image" accept="image/png, image/jpeg, image/gif" onchange="previewImage(event)">
                            </div>
                            <img id="imagePreview" src="#" alt="Image Preview" class="image-preview"/>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="form-section">
                    <legend>Contact Information</legend>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required placeholder="e.g. jane.doe@example.com">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="text" id="phone" name="phone" required placeholder="e.g. (123) 456-7890">
                        </div>
                        <div class="form-group">
                            <label for="location">Location</label>
                            <input type="text" id="location" name="location" required placeholder="e.g. San Francisco, CA">
                        </div>
                        <div class="form-group">
                            <label for="linkedin">LinkedIn URL</label>
                            <input type="text" id="linkedin" name="linkedin" placeholder="e.g. linkedin.com/in/janedoe">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="website">Website/Portfolio</label>
                            <input type="text" id="website" name="website" placeholder="e.g. www.janedoe.com">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="form-section">
                    <legend>Professional Profile</legend>
                    <div class="form-row">
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="summary">Professional Summary</label>
                            <textarea id="summary" name="summary" rows="4" placeholder="A brief summary of your career, skills, and goals."></textarea>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="skills">Skills (comma-separated)</label>
                            <input type="text" id="skills" name="skills" required placeholder="e.g. Python, JavaScript, Project Management">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="education">Education</label>
                            <textarea id="education" name="education" rows="4" required placeholder="e.g. B.S. in Computer Science - University of California, Berkeley (2014-2018)"></textarea>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="experience">Work Experience</label>
                            <textarea id="experience" name="experience" rows="6" required placeholder="Enter each position on a new line. e.g. Software Engineer - Google (2018-Present)"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="certifications">Certifications/Licenses</label>
                            <input type="text" id="certifications" name="certifications" placeholder="e.g. AWS Certified Solutions Architect">
                        </div>
                        <div class="form-group">
                            <label for="activities">Activities/Organizations</label>
                            <input type="text" id="activities" name="activities" placeholder="e.g. Member, ACM">
                        </div>
                    </div>
                </fieldset>

                <div class="form-submit-group">
                    <button class="clr-btn" type="submit" style="width: 250px;">Generate Resume</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('imagePreview');
                output.src = reader.result;
                output.style.display = 'block';
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</body>
</html>
